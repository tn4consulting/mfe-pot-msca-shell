frontend:
  name: msca-shell
  # Generalizing the pattern proved live on employment-insurance-mfe --
  # see mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  # Local kind default stays at 1 (limits resource pressure on a
  # single-node dev cluster). EKS stays at 1 too now -- the real
  # cluster's 2 t3.medium nodes cap at 17 pods each (AWS VPC CNI ENI/IP
  # limit, not CPU/memory), and doubling replicas across the family blew
  # past that -- confirmed live (FailedScheduling: "Too many pods").
  # See mfe-pot/TODO.md's "Design principles" section.
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  image:
    repository: mfe-pot-msca-shell
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # strapiBaseUrl points at the platform repo's Strapi (charts/strapi,
  # Ingress host "cms", not "strapi" -- Strapi is an implementation
  # detail). resolveFederationManifest() tries this first, then falls
  # back to `remotes` below only if Strapi itself is unreachable/slow;
  # when Strapi's own charts/strapi/values.yaml REMOTE_*_URL env vars are
  # kept in sync with the hostnames below, both paths agree.
  #
  # `remotes` is the actual federation directory: each URL is the other
  # app's own public Ingress hostname (client-side federation loading
  # happens in the end user's browser, fetching remoteEntry.json directly
  # from that app's origin -- unlike dashboard-bff's
  # server-to-server calls in the dashboard chart, this is never
  # cluster-internal traffic). job-bank, employment-insurance, dashboard,
  # and life-events are all real, already-deployed sibling repos.
  runtimeConfig:
    strapiBaseUrl: "http://cms.mfe-pot.local"
    # mock-idp's own public Ingress hostname (mfe-pot-platform's
    # charts/mock-idp) -- browser-to-server, since the citizen's own
    # browser does a real top-level navigation here for /authorize and a
    # same-origin-CORS fetch for /token, same reason strapiBaseUrl above
    # is a public hostname and not in-cluster Service DNS.
    mockIdpBaseUrl: "http://mock-idp.mfe-pot.local"
    # Browser-reachable Ingress host, not in-cluster Service DNS -- see
    # mfe-pot-platform/charts/otel-collector.
    otelExporterOtlpEndpoint: "http://otel.mfe-pot.local"
    remotes:
      job-bank-mfe: "http://job-bank-mfe.mfe-pot.local/remoteEntry.json"
      employment-insurance-mfe: "http://employment-insurance-mfe.mfe-pot.local/remoteEntry.json"
      dashboard-mfe: "http://dashboard-mfe.mfe-pot.local/remoteEntry.json"
      life-events-mfe: "http://life-events-mfe.mfe-pot.local/remoteEntry.json"
    # Explicitly false here (not omitted) for every real deployment --
    # main.tsx's dev default is `true` (nx serve never signs anything), so
    # an absent key would silently inherit that and disable verification
    # in production too. See mfe-pot/docs/plans/
    # 20260811-1500-federation-remote-loading-integrity.md.
    allowUnverifiedRemotes: false

ingress:
  host: msca.mfe-pot.local
  className: nginx
  # TLS is off by default (kind/local has no real cert authority) --
  # values-eks.yaml turns this on for a real AWS deployment. See
  # templates/ingress.yaml for how these two fields are consumed.
  tls:
    enabled: false
    clusterIssuer: letsencrypt-staging
