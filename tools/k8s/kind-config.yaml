# Local Kubernetes for validating the containerized/deployed shape --
# see docs/plans/20260801-1935-mfe-pot-polyrepo-split-and-k8s-hosting.md's
# "Local dev with kind" section. Maps host ports 80/443 into the cluster
# so an Ingress is reachable at plain localhost, no standing tunnel
# process needed (unlike minikube).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
